<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b26">
  <title>Abdalrhman Alzoubi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #070b26;
      --blue: #3b82f6;
      --electric: #60a5fa;
      --purple: #8b5cf6;
      --ink: #f6f7ff;
      --muted: #aeb8d9;
      --line: rgba(148, 163, 255, .20);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { min-height: 100%; background: var(--navy); }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      overflow-x: hidden;
      color: var(--ink);
      font-family: "Cairo", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 70% 55% at 12% 8%, rgba(37, 99, 235, .30), transparent 68%),
        radial-gradient(ellipse 65% 65% at 92% 88%, rgba(124, 58, 237, .30), transparent 70%),
        linear-gradient(145deg, #050719 0%, #0a1031 48%, #130a32 100%);
    }
    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      z-index: 0;
      pointer-events: none;
      opacity: .35;
      background:
        linear-gradient(115deg, transparent 15%, rgba(96, 165, 250, .08) 16%, transparent 17%),
        linear-gradient(295deg, transparent 35%, rgba(192, 132, 252, .08) 36%, transparent 37%);
      transform: rotate(-8deg);
    }
    .card-shell { position: relative; z-index: 1; width: min(100%, 448px); animation: rise .85s cubic-bezier(.16, 1, .3, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.98); } to { opacity: 1; transform: none; } }
    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 255, .28);
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(20, 29, 77, .96), rgba(7, 11, 38, .98) 52%, rgba(18, 9, 48, .98));
      box-shadow: 0 0 0 1px rgba(96, 165, 250, .08), 0 25px 80px rgba(2, 5, 25, .68), 0 0 70px rgba(99, 102, 241, .13);
      isolation: isolate;
    }
    .card::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(125deg, rgba(255,255,255,.07), transparent 28%, transparent 68%, rgba(168,85,247,.08)); }
    .hero { position: relative; height: 342px; overflow: hidden; background: #070a22; }
    .hero::before {
      content: ""; position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(180deg, rgba(4, 6, 24, .05) 18%, rgba(4, 6, 24, .08) 38%, rgba(7, 11, 38, .94) 100%), linear-gradient(90deg, rgba(37, 99, 235, .12), transparent 42%, rgba(139, 92, 246, .16));
    }
    .hero img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 38%; filter: saturate(1.08) contrast(1.05); transform: scale(1.015); }
    .hero-top { position: absolute; top: 18px; left: 20px; right: 20px; z-index: 2; display: flex; align-items: center; justify-content: space-between; direction: ltr; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 7px 11px; border: 1px solid rgba(167, 139, 250, .38); border-radius: 999px; color: #ddd6fe; background: rgba(9, 13, 45, .48); backdrop-filter: blur(12px); font: 700 10px/1 "Space Grotesk", sans-serif; letter-spacing: 1.4px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--electric); box-shadow: 0 0 12px var(--electric); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; transform: scale(.72); } }
    .hero-glow { width: 54px; height: 54px; border-radius: 50%; background: radial-gradient(circle, rgba(96,165,250,.55), transparent 66%); filter: blur(2px); }
    .identity { position: absolute; right: 24px; bottom: 22px; left: 24px; z-index: 2; text-align: right; }
    .identity h1 { color: #fff; font: 800 clamp(30px, 8vw, 43px)/1.03 "Space Grotesk", "Cairo", sans-serif; letter-spacing: .5px; text-shadow: 0 4px 22px rgba(0,0,0,.45); direction: ltr; text-align: right; }
    .identity p { margin-top: 9px; color: #d4d9f4; font-size: 14px; font-weight: 600; letter-spacing: 1.5px; }
    .identity-line { width: 76px; height: 3px; margin: 15px 0 0 auto; border-radius: 4px; background: linear-gradient(90deg, var(--purple), var(--electric)); box-shadow: 0 0 18px rgba(96, 165, 250, .62); }
    .socials { display: grid; gap: 11px; padding: 22px 20px 19px; }
    .social-btn { position: relative; display: flex; align-items: center; gap: 13px; min-height: 70px; padding: 11px 14px; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; color: var(--ink); text-decoration: none; background: rgba(255,255,255,.055); box-shadow: inset 0 1px 0 rgba(255,255,255,.055); transition: transform .25s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease; }
    .social-btn::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s ease; }
    .social-btn:hover { transform: translateY(-3px); border-color: rgba(129, 140, 248, .62); background: rgba(96, 165, 250, .105); box-shadow: 0 12px 28px rgba(4, 7, 30, .34), 0 0 20px rgba(99, 102, 241, .12); }
    .social-btn:hover::before { opacity: 1; }
    .social-btn:active { transform: scale(.985); }
    .social-btn.facebook::before { background: linear-gradient(110deg, rgba(59,130,246,.18), transparent 48%); }
    .social-btn.instagram::before { background: linear-gradient(110deg, rgba(236,72,153,.18), transparent 48%); }
    .social-btn.snapchat::before { background: linear-gradient(110deg, rgba(250,204,21,.18), transparent 48%); }
    .social-btn.whatsapp::before { background: linear-gradient(110deg, rgba(34,197,94,.18), transparent 48%); }
    .icon { position: relative; z-index: 1; display: grid; place-items: center; flex: 0 0 45px; width: 45px; height: 45px; overflow: hidden; border: 1px solid rgba(255,255,255,.16); border-radius: 14px; background: linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.03)); }
    .icon img { width: 32px; height: 32px; object-fit: contain; filter: drop-shadow(0 3px 6px rgba(0,0,0,.28)); }
    .social-copy { position: relative; z-index: 1; display: flex; flex: 1; min-width: 0; flex-direction: column; gap: 2px; text-align: right; }
    .platform { color: #b9c4ea; font: 700 10px/1.2 "Space Grotesk", sans-serif; letter-spacing: 1.7px; text-transform: uppercase; }
    .username { overflow: hidden; color: #fff; font-size: 15px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: right; }
    .handle { color: #aeb8d9; font: 500 11px/1.2 "Space Grotesk", sans-serif; direction: ltr; text-align: right; }
    .arrow { position: relative; z-index: 1; color: #97a8df; font: 700 20px/1 "Space Grotesk", sans-serif; transition: color .25s ease, transform .25s ease; }
    .social-btn:hover .arrow { color: #c4b5fd; transform: translateX(-3px); }
    .footer { display: flex; align-items: center; justify-content: center; gap: 9px; padding: 15px 20px 18px; border-top: 1px solid rgba(148, 163, 255, .13); color: #8390bd; font: 600 9px/1 "Space Grotesk", sans-serif; letter-spacing: 2.2px; text-transform: uppercase; }
    .footer span { color: var(--purple); font-size: 8px; }
    @media (max-width: 420px) { body { padding: 14px 10px; } .card { border-radius: 24px; } .hero { height: 315px; } .socials { padding-inline: 14px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
